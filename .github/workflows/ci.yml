name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip ruff==0.6.9 black==24.8.0
      - name: ruff
        run: ruff check backend
      - name: black --check
        run: black --check backend
        # Formatting normalization is a tracked follow-up (docs/ROADMAP.md);
        # don't block PRs on it yet.
        continue-on-error: true

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip bandit pip-audit
      - name: Bandit SAST
        run: bandit -r backend/app -ll -ii
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt --strict || true

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cpaf_user
          POSTGRES_PASSWORD: cpaf_pass
          POSTGRES_DB: cpaf_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://cpaf_user:cpaf_pass@localhost:5432/cpaf_db_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-must-be-at-least-32-characters-long!
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm
      - name: Alembic migrate (Postgres)
        working-directory: backend
        run: alembic upgrade head
      - name: Unit + integration tests (fast)
        working-directory: backend
        run: pytest --cov=app --cov-report=xml
      - name: Heavy ML tests (slow)
        working-directory: backend
        run: pytest -m slow --no-cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npm run test
      - run: npm run lint:dead
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true

  docker-build:
    needs: [backend-lint, backend-security, backend-test, frontend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cpaf-backend:latest
      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cpaf-frontend:latest
      - name: Trivy image scan (backend)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/cpaf-backend:latest
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
