name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip ruff==0.6.9 black==24.8.0
      - name: ruff
        run: ruff check backend
      - name: black --check
        run: black --check backend

  backend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --upgrade pip bandit pip-audit
      - name: Bandit SAST
        run: bandit -r backend/app -ll -ii
      - name: pip-audit
        run: pip-audit -r backend/requirements.txt --strict || true

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: cpaf_user
          POSTGRES_PASSWORD: cpaf_pass
          POSTGRES_DB: cpaf_db_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://cpaf_user:cpaf_pass@localhost:5432/cpaf_db_test
      REDIS_URL: redis://localhost:6379
      SECRET_KEY: test-secret-key-must-be-at-least-32-characters-long!
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm
      - name: Alembic migrate (Postgres)
        working-directory: backend
        run: alembic upgrade head
      - name: Unit + integration tests (fast)
        working-directory: backend
        run: pytest --cov=app --cov-report=xml
      - name: Heavy ML tests (slow)
        working-directory: backend
        run: pytest -m slow --no-cov

  mcp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: mcp/requirements.txt
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r mcp/requirements.txt pytest pytest-cov
      - name: Unit tests
        working-directory: mcp
        run: pytest --cov=server --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      CYPRESS_INSTALL_BINARY: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - run: npm run test
      - run: npm run lint:dead
      - name: npm audit (high+)
        run: npm audit --audit-level=high || true

  e2e:
    needs: [frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: |
          docker compose up -d --build postgres redis migrate backend frontend
          # wait for the backend to be ready
          for i in $(seq 1 40); do
            curl -sf http://localhost:8000/health/ready && break || sleep 3
          done
          docker compose exec -T backend python seed_db.py || true
      - name: Smoke test (curl)
        run: bash scripts/smoke.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Playwright
        working-directory: frontend
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose down -v

  docker-build:
    needs: [backend-lint, backend-security, backend-test, frontend, e2e]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Build + push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cpaf-backend:latest
      - name: Build + push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cpaf-frontend:latest
      - name: Trivy image scan (backend)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/cpaf-backend:latest
          format: table
          exit-code: "0"
          severity: HIGH,CRITICAL
