name: Weekly Model Retraining

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2:00 AM
  workflow_dispatch: # Allow manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Train models
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MODEL_STORE_URI: ${{ secrets.MODEL_STORE_URI }}
        run: |
          python -m app.ml.train --production --model-version "v$(date +%Y.%m.%d)-${GITHUB_SHA::7}"

      # Validation gate + publish to the model store are added in MT-09
      # (app/ml/model_validation.ModelValidator + model store upload). Model
      # binaries are NOT committed back to git.
      - name: Upload artifacts (build record)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: backend/app/ml/model_artifacts/*.pkl
          if-no-files-found: error
          retention-days: 30
