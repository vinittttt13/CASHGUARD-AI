name: Weekly Model Retraining

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2:00 AM
  workflow_dispatch: # Allow manual trigger

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          python -m spacy download en_core_web_sm

      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Train + validate + publish
        working-directory: backend
        env:
          PYTHONPATH: .
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          MODEL_STORE_URI: ${{ secrets.MODEL_STORE_URI }}
        run: |
          # --publish uploads to MODEL_STORE_URI ONLY if the ModelValidator gate
          # passes. Model binaries are never committed back to git.
          python -m app.ml.train --production --publish \
            --model-version "v$(date +%Y.%m.%d)-${GITHUB_SHA::7}"

      - name: Upload artifacts (build record)
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: backend/app/ml/model_artifacts/*.pkl
          if-no-files-found: error
          retention-days: 30
