services:
  postgres:
    # Plain Postgres — PostGIS was dropped in MT-07 (see docs/adr/0001-postgis.md).
    image: postgres:15
    container_name: cpaf_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpaf_db}
      POSTGRES_USER: ${POSTGRES_USER:-cpaf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpaf_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host-side port is configurable because 5432 is commonly taken by a
      # native/local Postgres install. Containers always reach this service
      # at postgres:5432 over the compose network regardless of this value.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpaf_user} -d ${POSTGRES_DB:-cpaf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cpaf_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot schema migration. Runs `alembic upgrade head` and exits; the
  # backend waits for it to complete successfully before starting. This is the
  # ONLY thing that touches the schema (no create_all at app startup).
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpaf_migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cpaf_user}:${POSTGRES_PASSWORD:-cpaf_pass}@postgres:5432/${POSTGRES_DB:-cpaf_db}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpaf_backend
    environment:
      # Hostnames are fixed to the compose network — do NOT let a dev .env
      # (which points at localhost) override them.
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-cpaf_user}:${POSTGRES_PASSWORD:-cpaf_pass}@postgres:5432/${POSTGRES_DB:-cpaf_db}
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000"]}
    volumes:
      - ./backend/app:/app/app
      - ./backend/app/ml/model_artifacts:/app/app/ml/model_artifacts
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* vars are compiled into the client bundle at build time,
      # so they must be passed as build args, not (only) runtime env vars —
      # a plain `environment:` entry below has no effect on client code.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    container_name: cpaf_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      # node:18-alpine has no curl; wget is available (busybox) and is what
      # the image's own Dockerfile HEALTHCHECK already uses — this override
      # had drifted from that and always reported unhealthy despite the app
      # serving requests fine.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer
    container_name: cpaf_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: cashguard-mcp:latest
    container_name: cpaf_mcp
    profiles: ["mcp", "tools"]
    environment:
      - DATABASE_URL=postgresql://cpaf_user:cpaf_pass@postgres:5432/cpaf_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  claude:
    build:
      context: .
      dockerfile: Dockerfile.claude
    image: cashguard-claude:latest
    container_name: cpaf_claude
    stdin_open: true
    tty: true
    working_dir: /workspace
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - DATABASE_URL=postgresql://cpaf_user:cpaf_pass@postgres:5432/cpaf_db
      - REDIS_URL=redis://redis:6379
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - TERM=xterm-256color
    volumes:
      - .:/workspace
      - claude_config:/root/.claude
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["claude", "tools"]

volumes:
  postgres_data:
  claude_config:
