version: "3.8"

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: cpaf_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpaf_db}
      POSTGRES_USER: ${POSTGRES_USER:-cpaf_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpaf_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cpaf_user} -d ${POSTGRES_DB:-cpaf_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cpaf_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cpaf_backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://cpaf_user:cpaf_pass@postgres:5432/cpaf_db}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cpaf_frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  adminer:
    image: adminer
    container_name: cpaf_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    image: cashguard-mcp:latest
    container_name: cpaf_mcp
    profiles: ["mcp", "tools"]
    environment:
      - DATABASE_URL=postgresql://cpaf_user:cpaf_pass@postgres:5432/cpaf_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
