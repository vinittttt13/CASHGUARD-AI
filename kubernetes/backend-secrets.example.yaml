# Template only — never commit real credentials.
#
#   cp kubernetes/backend-secrets.example.yaml /tmp/backend-secrets.yaml
#   # edit /tmp/backend-secrets.yaml with real values, then:
#   kubectl apply -f /tmp/backend-secrets.yaml
#
# Or, without ever writing the values to disk:
#   kubectl create secret generic backend-secrets \
#     --from-literal=DATABASE_URL="postgresql+asyncpg://cpaf_user:<password>@postgres-service:5432/cpaf_db" \
#     --from-literal=REDIS_URL="redis://redis-service:6379/0" \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
#
# Do NOT use `kubectl create secret generic backend-secrets --from-env-file=.env`
# (as an older revision of docs/DEVOPS_DEPLOYMENT_GUIDE.md suggested) — the
# local .env also carries NEXT_PUBLIC_*/frontend-only keys that don't belong
# in a backend Secret, and its DATABASE_URL/REDIS_URL point at localhost, not
# the in-cluster Service names used here.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://cpaf_user:REPLACE_ME@postgres-service:5432/cpaf_db"
  REDIS_URL: "redis://:REPLACE_ME@redis-service:6379/0"
  SECRET_KEY: "REPLACE_ME_WITH_A_REAL_32PLUS_CHAR_SECRET"
