# Template only — never commit real credentials.
#
#   cp kubernetes/postgres-secrets.example.yaml /tmp/postgres-secrets.yaml
#   # edit /tmp/postgres-secrets.yaml with real values, then:
#   kubectl apply -f /tmp/postgres-secrets.yaml
#
# Or, without ever writing the values to disk:
#   kubectl create secret generic postgres-secrets \
#     --from-literal=POSTGRES_DB=cpaf_db \
#     --from-literal=POSTGRES_USER=cpaf_user \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -base64 32)"
#
# These same values must also appear in backend-secrets' DATABASE_URL
# (postgresql+asyncpg://<user>:<password>@postgres-service:5432/<db>) — the
# backend does not read POSTGRES_* directly, only DATABASE_URL.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secrets
type: Opaque
stringData:
  POSTGRES_DB: "cpaf_db"
  POSTGRES_USER: "cpaf_user"
  POSTGRES_PASSWORD: "REPLACE_ME_WITH_A_REAL_SECRET"
