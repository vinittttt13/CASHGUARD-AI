# Template only — never commit a real password.
#
#   kubectl create secret generic redis-secrets \
#     --from-literal=REDIS_PASSWORD="$(openssl rand -base64 32)"
#
# The same password must be reflected in backend-secrets' REDIS_URL
# (redis://:<password>@redis-service:6379/0) — redis-deployment.yaml only
# uses this to start Redis with --requirepass; it doesn't rewrite the
# backend's connection string for you.
apiVersion: v1
kind: Secret
metadata:
  name: redis-secrets
type: Opaque
stringData:
  REDIS_PASSWORD: "REPLACE_ME_WITH_A_REAL_SECRET"
